# Declarative override of Kourier's own `kourier` Service. Upstream
# kourier.yaml (what `knative-ctl install kourier` applies) declares
# this as type: LoadBalancer -- fine on its own, but it fights
# nginx-ingress for the node's host ports 80/443 in the north-south
# pattern (../README.md), where nginx-ingress is meant to be the only
# external LoadBalancer. This file is the exact same Service, faithfully
# copied from the live object (selector, ports), with only `type`
# changed to ClusterIP.
#
# Apply this AFTER (re)installing Kourier, not before -- order matters:
#
#   knative-ctl install kourier
#   kubectl apply -f infra/ingress/kourier-clusterip.yaml
#
# Re-applying plain kourier.yaml afterward (a knative-ctl reinstall, a
# version bump, CI, whatever) resets the type back to LoadBalancer via
# kubectl apply's own 3-way merge, since its last-applied-configuration
# still says LoadBalancer -- that's what silently undid a `kubectl
# patch` version of this same change previously. Re-run the apply above
# any time that happens; it's idempotent.
apiVersion: v1
kind: Service
metadata:
  name: kourier
  namespace: kourier-system
  labels:
    app.kubernetes.io/component: net-kourier
    app.kubernetes.io/name: knative-serving
    networking.knative.dev/ingress-provider: kourier
spec:
  type: ClusterIP
  selector:
    app: 3scale-kourier-gateway
  ports:
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
