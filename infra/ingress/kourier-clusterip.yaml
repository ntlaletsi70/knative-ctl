# Declarative override of Kourier's own `kourier` Service. Upstream
# kourier.yaml declares it as type: LoadBalancer; this repo never wants
# Kourier exposed that way. On a cluster with MetalLB it would claim the
# first pool address ahead of nginx-ingress, and there'd be two external
# entry points instead of one. This file is the exact same Service
# (selector, ports), with only `type` changed to ClusterIP.
#
# Traffic reaches Kourier through ClusterIP only:
#   east-west    pod -> kourier-internal.kourier-system.svc.cluster.local
#   north-south  nginx-ingress -> Ingress (kourier-northsouth-ingress.yaml)
#                -> kourier-internal
#
# `knative-ctl install kourier` applies this right after upstream
# kourier.yaml, every time. It has to be every time: re-applying upstream
# resets the type back to LoadBalancer via kubectl apply's 3-way merge,
# which is what silently undid a one-off `kubectl patch` of this before.
apiVersion: v1
kind: Service
metadata:
  name: kourier
  namespace: kourier-system
  labels:
    app.kubernetes.io/component: net-kourier
    app.kubernetes.io/name: knative-serving
    networking.knative.dev/ingress-provider: kourier
spec:
  type: ClusterIP
  selector:
    app: 3scale-kourier-gateway
  ports:
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
