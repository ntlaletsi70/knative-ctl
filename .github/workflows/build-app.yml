name: build-app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knative-demo-app:latest
            ghcr.io/${{ github.repository_owner }}/knative-demo-app:${{ github.sha }}
            ttl.sh/knative-demo-app-${{ github.sha }}:24h
