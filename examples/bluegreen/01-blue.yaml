# Step 1: deploy the "blue" (current live) revision.
# Apply with: kubectl apply -f examples/bluegreen/01-blue.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: knative-demo-app
  namespace: knative-demo
spec:
  template:
    metadata:
      name: knative-demo-app-blue
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: ttl.sh/knative-demo-app-c0c8efd860cd8f667df40e13e681dbfe3a0ec1fe:24h  # ttl.sh, 24h TTL from build -- see README for why (GHCR access blocked), rebuild via build-app.yml if expired
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (blue)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
