# Step 2: deploy "green" and cut traffic over to it atomically -- both
# revisions are named explicitly so this one file can express the full
# before/after state in a single apply (no gradual steps, unlike canary).
# Blue is kept at 0% for instant rollback:
#   knative-ctl rollback helloworld-go helloworld-go-blue
#
# To deploy green *dark* first and validate it before cutting over
# (rather than doing it all in one apply), split this into two applies:
# first with green at 0%/blue at 100%, curl green via its tag hostname
# (http://green-helloworld-go.<namespace>.svc.cluster.local), then flip
# the percentages once you're satisfied -- exactly what
# `knative-ctl bluegreen` automates.
#
# Apply with: kubectl apply -f examples/bluegreen/02-green-cutover.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helloworld-go
  namespace: default
spec:
  template:
    metadata:
      name: helloworld-go-green
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: gcr.io/knative-samples/helloworld-go
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (green)"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  traffic:
    - revisionName: helloworld-go-green
      percent: 100
      tag: green
    - revisionName: helloworld-go-blue
      percent: 0
      tag: blue
