# Step 2: introduce v2 and split traffic 80/20 between the stable and
# canary revisions. Both revisions are named explicitly (via
# spec.template.metadata.name) so spec.traffic can pin them by name --
# without that, Knative auto-generates revision names and you'd have to
# look up the new one after applying before you could reference it here.
#
# The v2 image is the same gcr.io/knative-samples/helloworld-go build as
# v1 (no distinct v2 sample is published) -- swap it for your own
# versioned image in real use. The env var change alone is enough to
# prove which revision served a given request while testing this split.
#
# Apply with: kubectl apply -f examples/canary/02-canary-split.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helloworld-go
  namespace: default
spec:
  template:
    metadata:
      name: helloworld-go-v2
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: gcr.io/knative-samples/helloworld-go
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (v2 canary)"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  traffic:
    - revisionName: helloworld-go-v1
      percent: 80
      tag: stable
    - revisionName: helloworld-go-v2
      percent: 20
      tag: canary
