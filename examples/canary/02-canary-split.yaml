# Step 2: introduce v2 and split traffic 80/20 between the stable and
# canary revisions. Both revisions are named explicitly (via
# spec.template.metadata.name) so spec.traffic can pin them by name --
# without that, Knative auto-generates revision names and you'd have to
# look up the new one after applying before you could reference it here.
#
# The v2 image is the same ghcr.io/ntlaletsi70/knative-demo-app:latest
# build as v1 (only one version has been published by CI so far) -- once
# build-app.yml has produced more than one tag, point v2 at a real
# ":<sha>" tag instead. The env var change alone is enough to prove which
# revision served a given request while testing this split.
#
# Apply with: kubectl apply -f examples/canary/02-canary-split.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: knative-demo-app
  namespace: knative-demo
spec:
  template:
    metadata:
      name: knative-demo-app-v2
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: ghcr.io/ntlaletsi70/knative-demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (v2 canary)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
  traffic:
    - revisionName: knative-demo-app-v1
      percent: 80
      tag: stable
    - revisionName: knative-demo-app-v2
      percent: 20
      tag: canary
