# Maps this node's Tailscale MagicDNS hostname directly to
# github-receiver. Knative's auto-generated *.svc.cluster.local route is
# cluster-local-only (the external `kourier` Service 404s it -- only
# kourier-internal serves cluster-local routes, a known gotcha from
# early in this PoC). A DomainMapping gives this specific hostname a
# real externally-routable route instead, which is what tailscale
# funnel actually needs to reach through Kourier's external NodePort.
apiVersion: serving.knative.dev/v1beta1
kind: DomainMapping
metadata:
  name: blanketops.tailf8145.ts.net
  namespace: knative-demo
spec:
  ref:
    name: github-receiver
    kind: Service
    apiVersion: serving.knative.dev/v1
