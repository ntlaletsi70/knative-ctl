name: build-eventing-demo

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "eventing-demo/**"
      - ".github/workflows/build-eventing-demo.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [receiver, echo-logger]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: eventing-demo/${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventing-demo-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/eventing-demo-${{ matrix.component }}:${{ github.sha }}
            ttl.sh/eventing-demo-${{ matrix.component }}-${{ github.sha }}:24h
