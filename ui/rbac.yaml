# Scoped to knative-demo only -- the dashboard's own default namespace
# and the only one this PoC uses. Extend if pointing it at more
# namespaces later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knative-ui
  namespace: knative-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: knative-ui
  namespace: knative-demo
rules:
  # Pods panel: live status of whatever's currently running.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Release panel: knative-ctl canary/bluegreen/rollback read the
  # current revision and patch spec.traffic on the ksvc.
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch"]
  # knative-ctl waits on revision readiness during a release.
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: knative-ui
  namespace: knative-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: knative-ui
subjects:
  - kind: ServiceAccount
    name: knative-ui
    namespace: knative-demo
