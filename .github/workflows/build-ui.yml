name: build-ui

on:
  push:
    branches: [main]
    paths:
      - "main.go"
      - "release.go"
      - "go.mod"
      - "ui/**"
      - ".github/workflows/build-ui.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knative-ui:latest
            ghcr.io/${{ github.repository_owner }}/knative-ui:${{ github.sha }}
            ttl.sh/knative-ui-${{ github.sha }}:24h
