# Step 3: promote v2 to 100% once the canary has proven itself. v1 is
# kept at 0% (still addressable via its "stable" tag) rather than removed,
# so rollback is a single traffic patch away -- see
# knative-ctl rollback knative-demo-app knative-demo-app-v1 --namespace knative-demo
#
# Apply with: kubectl apply -f examples/canary/03-promote.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: knative-demo-app
  namespace: knative-demo
spec:
  template:
    metadata:
      name: knative-demo-app-v2
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: ghcr.io/ntlaletsi70/knative-demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (v2 canary)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
  traffic:
    - revisionName: knative-demo-app-v2
      percent: 100
      tag: canary
    - revisionName: knative-demo-app-v1
      percent: 0
      tag: stable
