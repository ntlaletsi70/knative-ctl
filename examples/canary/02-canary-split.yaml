# Step 2: introduce v2 and split traffic 80/20 between the stable and
# canary revisions. Both revisions are named explicitly (via
# spec.template.metadata.name) so spec.traffic can pin them by name --
# without that, Knative auto-generates revision names and you'd have to
# look up the new one after applying before you could reference it here.
#
# The v2 image is the same ttl.sh/... build as v1 (see the image line
# below for why this repo points at ttl.sh instead of its own ghcr.io
# image, and its 24h TTL) -- once you have more than one real build,
# point v2 at a distinct ":<sha>" tag instead. The env var change alone
# is enough to prove which revision served a given request while testing
# this split.
#
# Apply with: kubectl apply -f examples/canary/02-canary-split.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: knative-demo-app
  namespace: knative-demo
spec:
  template:
    metadata:
      name: knative-demo-app-v2
      annotations:
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/target-utilization-percentage: "70"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
        - image: ttl.sh/knative-demo-app-c0c8efd860cd8f667df40e13e681dbfe3a0ec1fe:24h  # ttl.sh, 24h TTL from build -- see README for why (GHCR access blocked), rebuild via build-app.yml if expired
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative PoC on blanketops (v2 canary)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
  traffic:
    - revisionName: knative-demo-app-v1
      percent: 80
      tag: stable
    - revisionName: knative-demo-app-v2
      percent: 20
      tag: canary
